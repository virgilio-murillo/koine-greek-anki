[project]
name = "anki-api"
version = "0.1.0"
description = "Local HTTP API for programmatic Anki deck/card management"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "genanki==0.13.1",
    "pydantic==2.11.3",
]

[project.scripts]
anki-api = "anki_api.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
